<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Recruitemon</title>
  <!-- Using Google Fonts "Luckiest Guy" for the chunky game-logo look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
  <link rel="stylesheet" href="style.css?v=006">
</head>
<body>
  <!-- Client/UI layer -->
  <div id="game-container">
    <button class="settings-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>

    <div class="title-block">
      <h1 class="game-title" aria-label="Recruitemon">
        <span class="letter">R</span><span class="letter">e</span><span class="letter">c</span><span class="letter">r</span><span class="letter">u</span><span class="letter">i</span><span class="letter">t</span><span class="letter">e</span><span class="letter">m</span><span class="pokeball-o" aria-hidden="true"></span><span class="letter">n</span>
      </h1>
      <p class="game-tagline">Gotta hire 'em all!</p>
    </div>

    <div class="button-group">
      <button class="btn btn-start" id="startGameBtn">Start Game</button>
      <button class="btn btn-highscore" id="highScoreBtn">High Score</button>
    </div>

    <p class="footer-text">&copy; 2026 TalentCatch Studios | v0.9 (Beta) | recruitemon.app</p>

    <div id="highscore-panel" class="highscore-panel hidden">
      <h2>High Score</h2>
      <p id="highscore-value">0</p>
      <button class="btn btn-close" id="closeHighScoreBtn">Close</button>
    </div>
  </div>

  <script src="app.js?v=006"></script>
</body>
</html>
