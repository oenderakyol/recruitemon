<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Recruitemon</title>
  <link rel="stylesheet" href="style.css?v=002">
</head>
<body>
  <!-- Client/UI layer -->
  <div id="game-container">
    <div class="button-group">
      <button class="btn btn-start" id="startGameBtn">Start Game</button>
      <button class="btn btn-highscore" id="highScoreBtn">High Score</button>
    </div>

    <div id="highscore-panel" class="highscore-panel hidden">
      <h2>High Score</h2>
      <p id="highscore-value">0</p>
      <button class="btn btn-close" id="closeHighScoreBtn">Close</button>
    </div>
  </div>

  <script src="app.js?v=002"></script>
</body>
</html>
